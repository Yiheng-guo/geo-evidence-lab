name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/geo-evidence-lab/scripts/geo_lab.py compare --profile examples/profile.json --plan examples/plan.json --pre examples/pre.json --post examples/post.json --out /tmp/geo-report
